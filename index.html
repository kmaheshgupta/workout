<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f8fa" />
  <title>Mahesh · Workout Assistant</title>
  <meta name="description" content="Personal workout assistant with step-by-step form guidance." />
  <script>
    // Set the theme before first paint: saved choice, else the device preference.
    (function () {
      var t;
      try { t = localStorage.getItem("workout:theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Ambient animated background glow -->
  <div class="bg-orbs" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <!-- Top bar -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-left">
        <div class="avatar" aria-hidden="true"><svg class="ico"><use href="#i-dumbbell"/></svg></div>
        <div class="topbar-greeting">
          <span class="greeting-line" id="greetingLine">Welcome back,</span>
          <strong class="greeting-name" id="greetingName">Mahesh</strong>
        </div>
      </div>

      <!-- Desktop tabs (moved to the bottom bar on phone/tablet via CSS) -->
      <nav class="tabs" id="tabs" aria-label="Sections">
        <button class="tab is-active" data-nav="home" type="button"><svg class="ico"><use href="#i-home"/></svg><span>Today</span></button>
        <button class="tab" data-nav="weekly" type="button"><svg class="ico"><use href="#i-calendar"/></svg><span>Week</span></button>
        <button class="tab" data-nav="nutrition" type="button"><svg class="ico"><use href="#i-apple"/></svg><span>Nutrition</span></button>
      </nav>

      <div class="topbar-right">
        <a class="profile-link" href="https://kmaheshgupta.github.io/" title="Back to profile">
          <svg class="ico"><use href="#i-arrow-left"/></svg><span>Profile</span>
        </a>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch theme">
          <svg class="ico sun"><use href="#i-sun"/></svg>
          <svg class="ico moon"><use href="#i-moon"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="app-shell">
    <main class="views" id="views">

      <!-- ============ TODAY ============ -->
      <section class="view view-home is-active" id="view-home" tabindex="-1">
        <div class="home-grid">
          <!-- The current session is the focus: hero + today's exercise plan -->
          <div class="home-main">
            <p class="date-line" id="dateLine"></p>
            <article class="today-card" id="todayCard"><!-- filled by app.js --></article>
            <div id="sessionPlan"><!-- today's exercises with key cue --></div>
          </div>
          <!-- Help for this session; the week is only a compact summary -->
          <aside class="home-side">
            <div id="sessionHelp"><!-- safety, warm-up, breathing, music --></div>
            <blockquote class="quote-card" id="quoteCard">
              <span class="quote-mark" aria-hidden="true">&ldquo;</span>
              <span class="quote-text" id="quoteText"></span>
            </blockquote>
            <div class="week-mini">
              <div class="week-mini-head">
                <span class="week-mini-title">This week</span>
                <span class="week-mini-streak"><svg class="ico"><use href="#i-flame"/></svg><b id="statStreak">0</b> day streak</span>
              </div>
              <div class="week-strip" id="weekStrip"><!-- day tiles --></div>
            </div>
          </aside>
        </div>
      </section>

      <!-- ============ WEEK ============ -->
      <section class="view view-weekly" id="view-weekly" tabindex="-1">
        <h1 class="view-title">Your week</h1>
        <p class="view-sub">Tap a day to see its exercises and start a guided session.</p>
        <div class="day-grid" id="dayGrid"><!-- day cards --></div>
      </section>

      <!-- ============ DAY DETAIL ============ -->
      <section class="view view-day" id="view-day" tabindex="-1">
        <button class="back-btn" data-nav="weekly" type="button"><svg class="ico"><use href="#i-chev-left"/></svg>Week</button>
        <div id="dayDetail"><!-- filled by app.js --></div>
      </section>

      <!-- ============ EXERCISE / GUIDED SESSION ============ -->
      <section class="view view-exercise" id="view-exercise" tabindex="-1">
        <div id="exerciseDetail"><!-- filled by app.js --></div>
      </section>

      <!-- ============ NUTRITION ============ -->
      <section class="view view-nutrition" id="view-nutrition" tabindex="-1">
        <div id="nutritionView"><!-- filled by app.js --></div>
      </section>

    </main>
  </div>

  <!-- Bottom tab bar (phone/tablet) -->
  <nav class="bottom-nav" aria-label="Sections">
    <button class="nav-btn is-active" data-nav="home" type="button"><svg class="ico"><use href="#i-home"/></svg><span>Today</span></button>
    <button class="nav-btn" data-nav="weekly" type="button"><svg class="ico"><use href="#i-calendar"/></svg><span>Week</span></button>
    <button class="nav-btn" data-nav="nutrition" type="button"><svg class="ico"><use href="#i-apple"/></svg><span>Nutrition</span></button>
  </nav>

  <!-- Celebration layer -->
  <div class="celebrate" id="celebrate" aria-hidden="true"></div>

  <!-- Line icon sprite -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></symbol>
      <symbol id="i-apple" viewBox="0 0 24 24"><path d="M12 7.5c-1.6-1.5-4.6-1.6-6.2.4-1.8 2.2-1.5 6.2.6 9.4 1.4 2.2 3.2 3.4 4.6 2.8.6-.3.9-.3 1-.3s.4 0 1 .3c1.4.6 3.2-.6 4.6-2.8 2.1-3.2 2.4-7.2.6-9.4-1.6-2-4.6-1.9-6.2-.4z"/><path d="M12 7.5c0-2 1-3.6 3-4.5"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></symbol>
      <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 22c3.9 0 7-2.8 7-6.8 0-3.1-1.9-5.6-3.6-7.2-.4 1.8-1.4 3.1-2.7 3.5.4-3.3-.9-6.5-3.7-8.5.1 3.6-2 5.6-3.6 7.6C4.3 12.2 5 13.9 5 15.2 5 19.2 8.1 22 12 22z"/></symbol>
      <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 13v4M8 21h8M9 17h6"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M4.5 12.5l5 5 10-11"/></symbol>
      <symbol id="i-chev-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
      <symbol id="i-chev-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
      <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-dumbbell" viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></symbol>
      <symbol id="i-zoom" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5M11 8v6M8 11h6"/></symbol>
      <symbol id="i-video" viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="14" height="13" rx="2.5"/><path d="M16.5 10l5-3v10l-5-3z"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.5 2.5 20h19z"/><path d="M12 10v4.5M12 17.5v.01"/></symbol>
      <symbol id="i-wind" viewBox="0 0 24 24"><path d="M3 8h10a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h7"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7.5 3v6c0 4.5-3.2 7.8-7.5 9-4.3-1.2-7.5-4.5-7.5-9V6z"/></symbol>
      <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></symbol>
      <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M5 19c0-8 5-14 15-15-1 10-7 15-15 15z"/><path d="M5 19l7-7"/></symbol>
      <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></symbol>
    </defs>
  </svg>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
